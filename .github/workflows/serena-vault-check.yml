name: SERENA Vault Check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_NAME: SERENA
  MODE: read-only-vault-check

jobs:
  vault-check:
    name: Read-only repository structure check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository in read-only mode
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Print SERENA protection notice
        run: |
          echo "SERENA / Serena Mode — read-only vault check"
          echo "This workflow does not deploy, publish, upload, train AI models, or send files to external services."
          echo "Repository contents are checked only inside GitHub Actions runtime."

      - name: Check key authorship and protection files
        run: |
          echo "Checking expected public files..."
          test -f README.md && echo "README.md found" || echo "README.md missing"
          test -f LICENSE && echo "LICENSE found" || echo "LICENSE missing"
          test -f AUTHORSHIP.md && echo "AUTHORSHIP.md found" || echo "AUTHORSHIP.md missing"
          test -f PUBLIC_AUTHORITY_NOTICE.md && echo "PUBLIC_AUTHORITY_NOTICE.md found" || echo "PUBLIC_AUTHORITY_NOTICE.md missing"
          test -f NO_USE_AND_RESTRICTED_ACCESS_NOTICE.md && echo "NO_USE_AND_RESTRICTED_ACCESS_NOTICE.md found" || echo "NO_USE_AND_RESTRICTED_ACCESS_NOTICE.md missing"
          test -f SPONSORS_AND_COMPENSATION_NOTICE.md && echo "SPONSORS_AND_COMPENSATION_NOTICE.md found" || echo "SPONSORS_AND_COMPENSATION_NOTICE.md missing"
          test -f BUSINESS_INTEREST_AND_CYBERCRIME_VISIBILITY_NOTICE.md && echo "BUSINESS_INTEREST_AND_CYBERCRIME_VISIBILITY_NOTICE.md found" || echo "BUSINESS_INTEREST_AND_CYBERCRIME_VISIBILITY_NOTICE.md missing"
          test -f SECURITY.md && echo "SECURITY.md found" || echo "SECURITY.md missing"
          test -f docs/LLAMADO_A_CLAUDE_RECONOCIMIENTO_Y_COMPENSACION_SERENA.md && echo "Claude call found" || echo "Claude call missing"
          test -f index.html && echo "index.html found" || echo "index.html missing"

      - name: Confirm no deployment is configured
        run: |
          echo "No deployment step configured."
          echo "No package publication configured."
          echo "No cloud provider configured."
          echo "No secrets required."
